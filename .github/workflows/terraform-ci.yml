name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only needs to read the repository
permissions:
  contents: read

# Every action is pinned to a full commit SHA, not a version tag. Tags can be
# moved to different code; in March 2026 attackers did exactly that to the
# trivy-action tags (CVE-2026-33634). A commit SHA cannot be changed.
# The comment after each SHA says which release it is.

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Trivy replaces tfsec - Aqua Security has moved tfsec's development
      # into Trivy. v0.35.0 is the release Aqua lists as safe after the
      # March 2026 compromise; it installs Trivy v0.69.3.
      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          # Reports findings without failing the build. Set this to 1 once the
          # remaining findings are addressed, so regressions break the build.
          exit-code: "0"
